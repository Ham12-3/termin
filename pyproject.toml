[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitaagent"
version = "0.1.0"
description = "A friendly terminal AI agent that explains nutrition, vitamins and minerals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.14,<4",
    "rich>=15,<16",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
vitaagent = "vitaagent.app:main"

[tool.setuptools.packages.find]
include = ["vitaagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
